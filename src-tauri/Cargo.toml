[workspace]
members = ["crates/large-file-engine"]
resolver = "2"

[package]
name = "markedit"
version = "1.0.2"
description = "轻量级 Markdown 编辑器"
authors = ["wy7980"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["devtools"] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
large-file-engine = { path = "crates/large-file-engine" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
